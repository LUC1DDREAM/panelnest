[package]
name = "asurascans"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
aidoku = { git = "https://github.com/Aidoku/aidoku-rs.git", rev = "e1320b0a2e11afb59e4dee374883a2212d325699", features = ["json"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

[dev-dependencies]
aidoku = { git = "https://github.com/Aidoku/aidoku-rs.git", rev = "e1320b0a2e11afb59e4dee374883a2212d325699", features = ["test", "json"] }
aidoku-test = { git = "https://github.com/Aidoku/aidoku-rs.git", rev = "e1320b0a2e11afb59e4dee374883a2212d325699" }

[lib]
crate-type = ["cdylib"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
strip = true
lto = true
