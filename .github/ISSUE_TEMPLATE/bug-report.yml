name: PanelNest problem report
description: Report a problem with a source, import or website.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Reports are public. Never include passwords, cookies, authorization headers, access tokens or private library data. Remove personal information from screenshots. No adult imagery."
  - type: input
    id: source
    attributes:
      label: Source and source version (or website/import)
      placeholder: "WEBTOON [PN], version 4 (multi.luc1d-webtoon); or PanelNest website/import"
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: Aidoku version and build
      placeholder: "0.9 (build 3)"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: iOS/iPadOS version and device (or browser)
      placeholder: "Enter your device and OS version, or browser and version for https://luc1ddream.github.io/panelnest/"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Aidoku and select Asura Scans [PN] (version 4).
        2. Search for a public title.
        3. Open its chapter list.
        Tell us which step fails and whether it happens every time.
      description: Include a public title or chapter URL only if needed. Do not share session URLs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      placeholder: "What should happen? Example: The chapter list appears and I can open a free chapter."
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result or error
      placeholder: "What happened instead? Example: The list stays empty after refreshing. Copy the error text, without tokens or private data."
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Optional screenshots or redacted logs
      description: Remove secrets, personal details and adult imagery before attaching.
